
<div class="modal fade" id="duplicateAssessmentModal" tabindex="-1"
    aria-labelledby="duplicateAssessmentModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="duplicateAssessmentModalLabel">
                    <i class="bi bi-copy me-2"></i>
                    Duplicate Assessment
                </h5>

                <button type="button" class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">
                <p>
                    Are you sure you want to duplicate this assessment?
                </p>

                <div class="card bg-light border-0 p-3">

                    <div class="mb-2">
                        <strong>Patient Name:</strong>
                        <span id="duplicatePatientName"></span>
                    </div>

                    <div>
                        <strong>MRN Number:</strong>
                        <span id="duplicateMRNNumber"></span>
                    </div>

                </div>

                <!-- NEW STUDENT SELECTION -->
                <div class="mt-3">
                    <label for="duplicateStudent" class="form-label fw-semibold">
                        New Student <span class="text-danger">*</span>
                    </label>

                    <select id="duplicateStudent" class="form-select" required>
                        <option value="">Select Student</option>

                        {% for s in students %}
                        <option value="{{ s.id }}">
                            {{ s.member_id }} – {{ s.official_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- NEW CLINICIAN SELECTION -->
                <div class="mt-3">
                    <label for="duplicateClinician" class="form-label fw-semibold">
                        New Clinician <span class="text-danger">*</span>
                    </label>

                    <select id="duplicateClinician" class="form-select" required>
                        <option value="">Select Clinician</option>

                        {% for c in clinicians %}
                        <option value="{{ c.id }}">
                            {{ c.member_id }} – {{ c.official_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="alert alert-warning mt-3 mb-0 small">

                    <i class="bi bi-exclamation-triangle me-1"></i>

                    Sections 1–4 and their sign-off history will be copied
                    into a new assessment.

                    The original assessment will remain unchanged.
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button type="button" class="btn btn-primary"
                    id="confirmDuplicateBtn">
                    <i class="bi bi-copy me-1"></i>
                    Confirm Duplicate
                </button>
            </div>
        </div>
    </div>
</div>
